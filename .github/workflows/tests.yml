name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Test the prediction engine (ubf_protein)
  test-engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ubf_protein[dev]
      
      - name: Run engine tests
        run: |
          cd ubf_protein
          python -m pytest tests/ -v --tb=short -x
      
      - name: Test public API imports
        run: |
          python -c "from ubf_protein.api import PredictionRunner, PredictionConfig, AggregationScreener"
          echo "API imports OK"

  # Test the backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/base.txt
          pip install -r backend/requirements/dev.txt
          pip install -e ubf_protein
      
      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short -x

  # Lint and type checking
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright
      
      - name: Run Ruff linter
        run: ruff check ubf_protein/ backend/app/ --ignore E501
        continue-on-error: true
      
      - name: Run type checker on API
        run: |
          pip install -e ubf_protein
          pyright ubf_protein/api/
        continue-on-error: true

  # Test Docker builds
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build backend image
        run: docker build -f docker/backend/Dockerfile -t pp-backend .
      
      - name: Build worker image
        run: docker build -f docker/worker/Dockerfile -t pp-worker .
      
      - name: Verify ubf_protein installed in worker
        run: |
          docker run --rm pp-worker python -c "from ubf_protein.api import PredictionRunner; print('OK')"
