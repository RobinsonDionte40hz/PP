services:
  # Nginx reverse proxy and frontend static file server
  nginx:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: pp_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Backend API server
  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: pp_backend
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - APP_ENV=production
      # Celery uses Redis DB 0
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      # Auth sessions use Redis DB 1 (separate for isolation)
      - REDIS_SESSION_URL=redis://redis:6379/1
      - SESSION_REDIS_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # JWT Configuration (NEW - v1.0.0)
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - SESSION_TTL_SECONDS=${SESSION_TTL_SECONDS:-900}
      - SESSION_EXPIRE_MINUTES=${SESSION_EXPIRE_MINUTES:-30}
      # Security Configuration (NEW - v1.0.0)
      - ENABLE_CSRF=${ENABLE_CSRF:-true}
      - ENABLE_HSTS=${ENABLE_HSTS:-true}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-31536000}
      # Email Configuration - loaded from .env.production via env_file
      # (Do not override here, let env_file handle SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD)
      - FEEDBACK_EMAIL=${FEEDBACK_EMAIL:-}
      # OAuth Configuration (Google and GitHub)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI:-}
      - FRONTEND_URL=${FRONTEND_URL:-https://emergentfolds.com}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./visualization_output:/app/visualization_output
      - ./pdb_cache:/app/pdb_cache
      - ./results:/app/results
      - ./user_data:/app/user_data
      - backend_logs:/app/logs
    env_file:
      - .env.production
    networks:
      - pp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Celery worker for background tasks
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: pp_worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - BACKEND_URL=http://backend:8000
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./visualization_output:/app/visualization_output
      - ./pdb_cache:/app/pdb_cache
      - ./results:/app/results
      - ./user_data:/app/user_data
      - worker_logs:/app/logs
    env_file:
      - .env.production
    networks:
      - pp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.celery_app inspect ping || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '1.0'
          memory: 2G

  # Celery beat scheduler for periodic tasks
  celery-beat:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      args:
        - BUILD_ENV=production
    container_name: pp_celery_beat
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - celery_beat_data:/app/celerybeat-schedule
    env_file:
      - .env.production
    networks:
      - pp_network
    restart: unless-stopped
    # Celery beat runs the scheduler (no concurrency needed)
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info", "--schedule=/app/celerybeat-schedule/celerybeat-schedule"]
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Redis cache and message broker
  redis:
    image: redis:7-alpine
    container_name: pp_redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - pp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: pp_postgres
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres_backups:/backups
    networks:
      - pp_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Optional: Monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: pp_prometheus
    expose:
      - "9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - pp_network
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: pp_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - pp_network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  pp_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  redis_data:
    driver: local
  postgres_data:
    driver: local
  postgres_backups:
    driver: local
  nginx_logs:
    driver: local
  backend_logs:
    driver: local
  worker_logs:
    driver: local
  celery_beat_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
