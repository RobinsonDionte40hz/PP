# Python logging configuration for production

[loggers]
keys=root,app,celery,uvicorn

[handlers]
keys=consoleHandler,fileHandler,errorHandler

[formatters]
keys=detailed,simple

[logger_root]
level=INFO
handlers=consoleHandler,fileHandler

[logger_app]
level=INFO
handlers=consoleHandler,fileHandler,errorHandler
qualname=app
propagate=0

[logger_celery]
level=INFO
handlers=consoleHandler,fileHandler
qualname=celery
propagate=0

[logger_uvicorn]
level=INFO
handlers=consoleHandler,fileHandler
qualname=uvicorn
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simple
args=(sys.stdout,)

[handler_fileHandler]
class=handlers.RotatingFileHandler
level=INFO
formatter=detailed
args=('/var/log/app/app.log', 'a', 104857600, 10, 'utf-8')

[handler_errorHandler]
class=handlers.RotatingFileHandler
level=ERROR
formatter=detailed
args=('/var/log/app/error.log', 'a', 104857600, 10, 'utf-8')

[formatter_detailed]
format=%(asctime)s - %(name)s - %(levelname)s - %(module)s:%(funcName)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S

[formatter_simple]
format=%(levelname)s - %(message)s
