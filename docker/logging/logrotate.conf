# Log rotation configuration for Docker containers

/var/log/app/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        docker-compose -f docker-compose.prod.yml exec backend kill -USR1 1 2>/dev/null || true
    endscript
}

/var/log/nginx/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        docker-compose -f docker-compose.prod.yml exec nginx nginx -s reopen 2>/dev/null || true
    endscript
}

/var/log/celery/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
}
