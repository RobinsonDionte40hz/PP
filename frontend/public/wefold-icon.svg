<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 380">
  <defs>
    <style>
      .atom-orbit { fill: none; stroke: #47597E; stroke-width: 4; }
      .atom-orbit-beige { fill: none; stroke: #B2AB8C; stroke-width: 4; }
      .atom-particle-blue { fill: #DBE6FD; }
      .atom-particle-beige { fill: #B2AB8C; }
    </style>
  </defs>
  
  <!-- Atom Structure Centered -->
  <g transform="translate(190, 190)">
    <!-- Orbits -->
    <ellipse class="atom-orbit" cx="0" cy="0" rx="150" ry="50" transform="rotate(-45)"/>
    <ellipse class="atom-orbit-beige" cx="0" cy="0" rx="150" ry="50" transform="rotate(45)"/>
    <ellipse class="atom-orbit" cx="0" cy="0" rx="120" ry="40" transform="rotate(0)"/>
    
    <!-- Particles on orbits -->
    <circle class="atom-particle-blue" cx="0" cy="-50" r="14"/>
    <circle class="atom-particle-blue" cx="106" cy="35" r="14"/>
    <circle class="atom-particle-blue" cx="-106" cy="35" r="14"/>
    <circle class="atom-particle-beige" cx="85" cy="-85" r="12"/>
    <circle class="atom-particle-beige" cx="-85" cy="-85" r="12"/>
    <circle class="atom-particle-beige" cx="120" cy="0" r="12"/>
    <circle class="atom-particle-beige" cx="-120" cy="0" r="12"/>
  </g>
</svg>
